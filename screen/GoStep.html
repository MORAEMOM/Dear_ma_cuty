<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Step</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f0ebe3;
      font-family: "Noto Serif KR", serif;
    }

    .letter {
      width: 90%;
      max-width: 520px;
      background: #fffdf7;
      padding: 30px 28px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      position: relative;
      line-height: 1.9;
      font-size: 1.05rem;

      /* 편지 줄 느낌 */
      background-image: linear-gradient(
        to bottom,
        transparent 27px,
        rgba(0,0,0,0.08) 28px
      );
      background-size: 100% 28px;
    }

    .text {
      text-align: left;
      white-space: pre-line;
    }

    .input-area {
      margin-top: 24px;
      text-align: center;
    }

    input {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    button {
      margin-left: 10px;
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      background: #333;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #555;
    }
  </style>
</head>

<body>
  <div class="letter">
    <div class="text">
그날 기억해?

늦은 밤 어색했던 그 공기.

100초가 넘던 침묵.

묘한 분위기.

누가봐도 저희 매우 조심하고 있어요 사진도....ㅋㅋ

그 날이 언제였을까...?
    </div>

    <div class="input-area">
      <input type="date" id="dateInput" />
      <button onclick="checkDate()">확인</button>
    </div>
  </div>

  <script>
    function checkDate() {
      const value = document.getElementById("dateInput").value;

      if (!value) return;

      const formatted = value.replaceAll("-", "");

      if (formatted === "20240627") {
        window.location.href = "Step1.html";
      } else {
        alert("다시 떠올려봐… 😏");
      }
    }

    document.getElementById("dateInput").addEventListener("keydown", function(e){
      if (e.key === "Enter") {
        checkDate();
      }
    });
  </script>
</body>
</html>
